<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="clipBoardGrad" x1="50" y1="40" x2="150" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#149c71"/>
      <stop offset="100%" stop-color="#0a6b4c"/>
