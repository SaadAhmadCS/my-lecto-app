name: my_lecto
description: "A personal lecture recorder. Records offline, then shares the audio to your own AI app for notes."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7

  # Dependency Injection
  get_it: ^8.0.3

  # Navigation
  go_router: ^15.1.2

  # Local Database
  sqflite: ^2.4.2
  path: ^1.9.1

  # Network

  # Audio
  record: ^7.1.1
  just_audio: ^0.9.43

  # Storage
  path_provider: ^2.1.6

  # UI
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  shimmer: ^3.0.0
  lottie: ^3.3.1

  # PDF
  pdf: ^3.11.3
  printing: ^5.14.3

  # Utils
  intl: ^0.20.2
  uuid: ^4.5.1
  permission_handler: ^11.4.0
  image_picker: ^1.1.2
  http: ^1.6.0
  flutter_markdown: ^0.7.7+1
  flutter_foreground_task: ^11.0.3
  shared_preferences: ^2.5.5
  flutter_local_notifications: ^22.3.1
  share_plus: ^12.0.2
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  sqflite_common_ffi: ^2.4.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
    - assets/animations/
